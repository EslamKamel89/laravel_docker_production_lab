services:
  php:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      COMPOSER_HOME: /tmp/composer
    volumes:
      - .:/var/www/html
  nginx:
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./public:/var/www/html/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
